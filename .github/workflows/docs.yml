name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "STATUS.md"
      - "README.md"
      - "scripts/docs-check.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "STATUS.md"
      - "README.md"
      - "scripts/docs-check.mjs"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    name: Validate docs (links + structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run docs validator
        run: node scripts/docs-check.mjs
